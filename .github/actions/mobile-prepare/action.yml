name: Prepare tablet application
description: Build and stage the shared renderer, restore pinned Cordova platform and local export plugin
inputs:
  platform:
    description: android or ios
    required: true
  release_tag:
    description: Stable release tag, empty for development builds
    default: ''
runs:
  using: composite
  steps:
    - run: node packaging/scripts/release-version.mjs
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
    - run: corepack enable
      shell: bash
    - run: yarn install --frozen-lockfile
      working-directory: react
      shell: bash
    - run: yarn build --base ./
      working-directory: react
      shell: bash
    - run: node packaging/scripts/stage.mjs mobile
      shell: bash
      env:
        IOS_UPDATE_URL: ${{ env.IOS_UPDATE_URL }}
    - run: npm ci
      working-directory: packaging/mobile
      shell: bash
    - run: node packaging/scripts/mobile-platform.mjs ${{ inputs.platform }}
      shell: bash
    - run: npx cordova plugin add ../plugins/gcam-files ../plugins/gcam-updates --nosave
      working-directory: packaging/mobile
      shell: bash
    - run: npx cordova prepare ${{ inputs.platform }}
      working-directory: packaging/mobile
      shell: bash
