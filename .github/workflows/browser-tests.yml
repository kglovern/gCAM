name: Browser workflows
on:
  workflow_call:

permissions:
  contents: read
jobs:
  cypress:
    name: Cypress shard ${{ matrix.shard }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: react
    env:
      CYPRESS_CACHE_FOLDER: ${{ github.workspace }}/react/.cache/Cypress
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: react/yarn.lock
      - run: corepack enable
      - uses: actions/cache@v4
        with:
          path: react/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('react/yarn.lock') }}
      - run: yarn install --frozen-lockfile
        env:
          CYPRESS_INSTALL_BINARY: '0'
      - name: Install Cypress
        run: |
          for attempt in 1 2 3; do
            if timeout 180s yarn cypress install; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Run browser tests
        env:
          TEST_SHARD: ${{ matrix.shard }}
        run: |
          specs=$(node --input-type=module -e 'import { readdirSync } from "node:fs"; console.log(readdirSync("cypress/e2e", { recursive: true }).filter(name => name.endsWith(".cy.js")).sort().filter((_, index) => index % 4 === Number(process.env.TEST_SHARD)).map(name => "cypress/e2e/" + name).join(","))')
          xvfb-run -a yarn test:e2e "$specs"
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failures-${{ matrix.shard }}
          path: |
            react/cypress/screenshots
            react/cypress/videos
          if-no-files-found: ignore
