name: Build and test

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      signed_android:
        description: Build signed Android release APK and AAB using repository secrets
        type: boolean
        default: false
      signed_ios:
        description: Build a signed iPad device IPA using Apple signing secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Validate release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Cancel superseded PR and main builds
        if: github.event_name == 'push'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const isRelease = context.ref.startsWith('refs/tags/');
            const pulls = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner, repo, commit_sha: context.sha, per_page: 100,
            });
            const merged = pulls.filter(pr => pr.merged_at);
            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner, repo, workflow_id: 'ci.yml', per_page: 100,
            });
            for (const run of runs) {
              if (run.id === context.runId || run.status === 'completed') continue;
              // Never cancel a newer run or a release tag.
              if (run.run_number >= context.runNumber) continue;
              const mergedPr = run.event === 'pull_request' && merged.some(pr =>
                run.pull_requests.some(item => item.number === pr.number) ||
                (run.head_sha === pr.head.sha && run.head_repository?.full_name === pr.head.repo?.full_name));
              const sameMain = isRelease && run.event === 'push' &&
                run.head_branch === 'main' && run.head_sha === context.sha;
              if (!mergedPr && !sameMain) continue;
              core.info(`Cancelling superseded run ${run.id} (${run.head_branch})`);
              try {
                await github.rest.actions.cancelWorkflowRun({ owner, repo, run_id: run.id });
              } catch (error) {
                if (error.status !== 409) throw error;
                core.info(`Run ${run.id} already finished or is cancelling`);
              }
            }
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate stable tag and main ancestry
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node packaging/scripts/release-version.mjs
          git merge-base --is-ancestor HEAD origin/main
  quality:
    needs: policy
    name: Quality
    uses: ./.github/workflows/quality.yml
  browser:
    needs: policy
    name: Browser tests
    uses: ./.github/workflows/browser-tests.yml
  desktop:
    needs: policy
    name: Desktop installers
    uses: ./.github/workflows/native-desktop.yml
    with:
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    secrets: inherit
  tablet:
    needs: [policy, quality, browser]
    name: Tablet builds
    uses: ./.github/workflows/native-mobile.yml
    with:
      release_tag: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      store_ios: ${{ github.ref_type == 'tag' && vars.IOS_RELEASE_ENABLED == 'true' }}
      signed_android: ${{ inputs.signed_android == true }}
      signed_ios: ${{ inputs.signed_ios == true }}
    secrets: inherit
  pages:
    name: Publish website
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [quality, browser, desktop, tablet]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml

  release:
    name: Prepare GitHub release
    if: github.ref_type == 'tag'
    needs: [quality, browser, desktop, tablet]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/download-artifact@v8
        with:
          pattern: gCAM-*
          path: release-assets
          merge-multiple: true
      - name: Assemble draft release
        run: node packaging/scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
