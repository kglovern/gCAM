name: Desktop installers

on:
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
            arch: x64
          - os: ubuntu-24.04
            target: linux
            arch: x64
          - os: macos-15-intel
            target: mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packaging/desktop/package-lock.json
      - name: Set release version
        run: node packaging/scripts/release-version.mjs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - run: corepack enable
      - run: yarn install --frozen-lockfile
        working-directory: react
      - run: yarn build --base ./
        working-directory: react
      - run: node packaging/scripts/stage.mjs desktop
      - run: npm ci
        working-directory: packaging/desktop
      - run: npm test
        working-directory: packaging/desktop
      - name: Smoke test desktop renderer and CAM worker
        if: runner.os != 'Linux'
        timeout-minutes: 2
        run: npm run smoke
        working-directory: packaging/desktop
      - name: Smoke test under Xvfb
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: xvfb-run -a node_modules/.bin/electron --no-sandbox smoke.cjs
        working-directory: packaging/desktop
      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ inputs.release_tag != '' && 'true' || 'false' }}
          CSC_LINK: ${{ inputs.release_tag != '' && (runner.os == 'macOS' && secrets.MAC_CERTIFICATE_BASE64 || runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_BASE64) || '' }}
          CSC_KEY_PASSWORD: ${{ inputs.release_tag != '' && (runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || runner.os == 'Windows' && secrets.WINDOWS_CERTIFICATE_PASSWORD) || '' }}
          APPLE_ID: ${{ inputs.release_tag != '' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ inputs.release_tag != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.release_tag != '' && secrets.APPLE_TEAM_ID || '' }}
        shell: bash
        run: |
          if [[ -z "$CSC_LINK" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run package -- --${{ matrix.target }} --${{ matrix.arch }}
        working-directory: packaging/desktop
      - name: Verify Apple Silicon installer architecture
        if: runner.os == 'macOS'
        run: xcrun lipo -verify_arch arm64 packaging/desktop/dist/mac-arm64/gCAM.app/Contents/MacOS/gCAM
      - uses: actions/upload-artifact@v7
        with:
          name: gCAM-${{ matrix.target }}-${{ matrix.arch }}
          path: |
            packaging/desktop/dist/*.exe
            packaging/desktop/dist/*.dmg
            packaging/desktop/dist/*.zip
            packaging/desktop/dist/*.AppImage
            packaging/desktop/dist/*.deb
            packaging/desktop/dist/latest*.yml
            packaging/desktop/dist/*.blockmap
          if-no-files-found: error
          retention-days: 14
