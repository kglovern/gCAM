name: Quality

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: react/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
      - run: yarn test --runInBand
      - run: yarn check-types
      - run: yarn lint
      - run: yarn format:check
      - run: yarn build
      - name: Native shell and startup tests
        working-directory: .
        run: node --test packaging/desktop/*.test.cjs packaging/scripts/*.test.mjs
      - name: Native source formatting and lint
        working-directory: packaging
        run: node ../react/node_modules/@biomejs/biome/bin/biome check .
